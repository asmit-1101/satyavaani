name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # sv_audio uses audioop, which Python 3.13 removed
      - name: Install
        run: pip install numpy scipy soundfile pytest
      - name: Run tests (no trained models or recordings needed)
        run: pytest -v
